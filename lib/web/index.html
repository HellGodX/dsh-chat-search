<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>旧话篓子 · 鱼鱼的记忆抽屉</title>
<style>
  :root {
    --bg: #0f1420;
    --panel: #161d2c;
    --line: rgba(140, 170, 220, .16);
    --text: #dbe4f5;
    --dim: #8494ae;
    --accent: #ffd23f;
    --accent-2: #ff9f6e;
    --you: #7fb6ff;
    --me: #ffd23f;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: radial-gradient(1200px 600px at 15% -10%, #1b2740 0%, var(--bg) 55%) fixed;
    color: var(--text);
    font: 14px/1.7 "Segoe UI", "Microsoft YaHei", system-ui, sans-serif;
    padding: 28px 18px 60px;
  }
  .wrap { max-width: 860px; margin: 0 auto; }
  header { display: flex; align-items: center; gap: 16px; margin-bottom: 6px; }
  .mascot { width: 104px; height: 118px; flex: none; }
  .mascot .body { fill: #ffd23f; stroke: #c9a116; stroke-width: 2; }
  .mascot .limb { stroke: #2a2a2a; stroke-width: 3.5; stroke-linecap: round; }
  .mascot .eye { fill: #fff; stroke: #2a2a2a; stroke-width: 1.5; }
  .mascot .pupil { fill: #1b1b1b; }
  .mascot .mouth { fill: none; stroke: #2a2a2a; stroke-width: 2.4; stroke-linecap: round; }
  .mascot .cheek { fill: #ff9f9f; opacity: .75; }
  h1 { font-size: 22px; margin: 0 0 4px; letter-spacing: .5px; }
  .sub { color: var(--dim); font-size: 12.5px; }
  .searchbox {
    margin: 18px 0 10px;
    display: flex; gap: 10px;
  }
  input[type="search"] {
    flex: 1; padding: 12px 14px; border-radius: 12px;
    border: 1px solid var(--line); background: var(--panel); color: var(--text);
    font-size: 15px; outline: none;
  }
  input[type="search"]:focus { border-color: rgba(255, 210, 63, .55); box-shadow: 0 0 0 3px rgba(255, 210, 63, .12); }
  button {
    padding: 12px 18px; border-radius: 12px; border: 1px solid rgba(255, 210, 63, .35);
    background: rgba(255, 210, 63, .14); color: var(--accent); cursor: pointer; font-size: 14px;
  }
  button:hover { background: rgba(255, 210, 63, .22); }
  .stat { color: var(--dim); font-size: 12px; min-height: 18px; margin-bottom: 12px; }
  .hit {
    border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; margin-bottom: 10px;
    background: linear-gradient(180deg, rgba(255,255,255,.02), rgba(255,255,255,0));
    cursor: pointer;
  }
  .hit:hover { border-color: rgba(255, 210, 63, .35); }
  .hit .meta { display: flex; gap: 10px; align-items: center; font-size: 12px; color: var(--dim); margin-bottom: 4px; }
  .badge { padding: 1px 8px; border-radius: 999px; font-size: 11px; border: 1px solid currentColor; }
  .badge.you { color: var(--you); }
  .badge.me { color: var(--me); }
  .snip { color: #e7edf9; word-break: break-word; }
  mark { background: rgba(255, 210, 63, .28); color: #fff; padding: 0 2px; border-radius: 3px; }
  .ctx { display: none; margin-top: 10px; padding-top: 10px; border-top: 1px dashed var(--line); }
  .ctx.open { display: block; }
  .ctx .row { display: flex; gap: 8px; padding: 4px 0; font-size: 13px; color: #cfd9ec; }
  .ctx .row b { flex: none; color: var(--dim); font-weight: 500; font-size: 12px; width: 40px; }
  .tip { color: var(--dim); font-size: 12.5px; margin-top: 24px; line-height: 1.9; }
  .empty { color: var(--dim); padding: 18px 4px; }
  footer { margin-top: 30px; color: #5d6b83; font-size: 12px; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <svg class="mascot" viewBox="0 0 120 140" aria-hidden="true">
      <line class="limb" x1="34" y1="48" x2="14" y2="80" />
      <line class="limb" x1="86" y1="48" x2="106" y2="80" />
      <line class="limb" x1="48" y1="112" x2="42" y2="134" />
      <line class="limb" x1="72" y1="112" x2="78" y2="134" />
      <rect class="body" x="20" y="18" width="80" height="98" rx="42" />
      <ellipse class="cheek" cx="34" cy="82" rx="9" ry="6" />
      <ellipse class="cheek" cx="86" cy="82" rx="9" ry="6" />
      <ellipse class="eye" id="eyeL" cx="44" cy="58" rx="13" ry="15" />
      <ellipse class="eye" id="eyeR" cx="76" cy="58" rx="13" ry="15" />
      <circle class="pupil" id="pupilL" cx="44" cy="60" r="5.6" />
      <circle class="pupil" id="pupilR" cx="76" cy="60" r="5.6" />
      <path class="mouth" id="mouth" d="M50 86 q10 8 20 0" />
    </svg>
    <div>
      <h1>旧话篓子</h1>
      <div class="sub">翻 DSH 会话里的旧话——按词、按事、按那天说过的半句。</div>
    </div>
  </header>

  <div class="searchbox">
    <input id="q" type="search" placeholder="搜个词试试：鲸鱼、熬夜、卡、快照…" autocomplete="off" />
    <button id="go">翻一翻</button>
  </div>
  <div class="stat" id="stat"></div>
  <div id="list"></div>

  <div class="tip">
    索引读的是 <code>.dsh/sessions</code> 里解压出来的会话，只在本机内存里过一遍，不往别处传。<br />
    点一条能展开前后两句。
  </div>
  <footer id="foot"></footer>
</div>

<script>
const $ = (id) => document.getElementById(id);
const qEl = $("q"), listEl = $("list"), statEl = $("stat"), footEl = $("foot");
const pupilL = $("pupilL"), pupilR = $("pupilR"), mouth = $("mouth");

// 小门面：输入的时候眼珠跟着动，搜到东西就咧嘴
qEl.addEventListener("mousemove", (e) => {
  const r = qEl.getBoundingClientRect();
  const dx = (e.clientX - r.left) / r.width - 0.5;
  const dy = (e.clientY - r.top) / r.height - 0.5;
  pupilL.setAttribute("cx", 44 + dx * 6);
  pupilL.setAttribute("cy", 60 + dy * 5);
  pupilR.setAttribute("cx", 76 + dx * 6);
  pupilR.setAttribute("cy", 60 + dy * 5);
});
function grin(on) {
  mouth.setAttribute("d", on ? "M46 84 q14 16 28 0" : "M50 86 q10 8 20 0");
}
function blink() {
  for (const id of ["eyeL", "eyeR"]) {
    const eye = document.getElementById(id);
    const orig = { rx: eye.getAttribute("rx"), ry: eye.getAttribute("ry") };
    eye.setAttribute("ry", 2);
    setTimeout(() => eye.setAttribute("ry", orig.ry), 110);
  }
}
setInterval(() => { if (Math.random() < 0.35) blink(); }, 3200);

function esc(s) {
  return String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}
function hl(s, q) {
  const terms = String(q || "").trim().split(/\s+/).filter(Boolean);
  let out = esc(s);
  for (const t of terms) {
    const re = new RegExp("(" + t.replace(/[.*+?^${}()|[\]\\]/g, "\\$&") + ")", "gi");
    out = out.replace(re, "<mark>$1</mark>");
  }
  return out;
}
function fmt(t) {
  if (!t) return "";
  const d = new Date(t);
  if (isNaN(d)) return String(t);
  const p = (n) => String(n).padStart(2, "0");
  return `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`;
}

async function run() {
  const q = qEl.value.trim();
  if (!q) { listEl.innerHTML = ""; statEl.textContent = ""; return; }
  statEl.textContent = "翻着呢…";
  try {
    const r = await fetch("/api/chatsearch?q=" + encodeURIComponent(q) + "&limit=80");
    const data = await r.json();
    if (!data.ok) throw new Error(data.error || "接口出错");
    const hits = data.hits || [];
    statEl.textContent = hits.length
      ? `找到 ${data.total} 条，先摆前 ${hits.length} 条（${data.sessions} 个会话里翻的）`
      : "没翻到，换个词试试。";
    grin(hits.length > 0);
    listEl.innerHTML = hits.length
      ? hits.map((h, i) => `
        <div class="hit" data-i="${i}">
          <div class="meta">
            <span class="badge ${h.role === "user" ? "you" : "me"}">${h.role === "user" ? "你" : "鱼鱼"}</span>
            <span>${esc(fmt(h.time))}</span>
            <span>${esc(h.sid.replace(/^session-/, "").slice(0, 8))}</span>
          </div>
          <div class="snip">${hl(h.snippet, data.query)}</div>
          <div class="ctx">${(h.context || []).map((c) => `
            <div class="row"><b>${c.role === "user" ? "你" : "鱼鱼"}</b><span>${esc(c.text.slice(0, 400))}</span></div>
          `).join("")}</div>
        </div>`).join("")
      : `<div class="empty">这条篓子里还没有。</div>`;
    listEl.querySelectorAll(".hit").forEach((el) => {
      el.addEventListener("click", () => el.querySelector(".ctx").classList.toggle("open"));
    });
  } catch (e) {
    statEl.textContent = "出了点岔子：" + e.message;
  }
}
$("go").addEventListener("click", run);
qEl.addEventListener("keydown", (e) => { if (e.key === "Enter") run(); });

// 带 ?q= 打开就直接搜，方便把链接存书签
const preset = new URLSearchParams(location.search).get("q");
if (preset) { qEl.value = preset; run(); }

fetch("/api/chatsearch/stats").then((r) => r.json()).then((s) => {
  if (s && s.ok) footEl.textContent = `索引 ${s.sessions} 个会话 / ${s.messages} 条消息`;
  else footEl.textContent = "";
}).catch(() => {});
</script>
</body>
</html>
